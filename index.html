<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy-Verwahrung</title>
<style>
/* Layout: Kopfzeile mit Hauptaktion, Reiter darunter, Schrank als 3x9-Raster wie das echte Schliessfach */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1c2430; --muted:#5a6473; --line:#d8d4cb;
  --accent:#1f4e79; --accent-ink:#ffffff; --ok:#2c7a4d; --warn-bg:#fff4d6;
  --v1:#f3d84a; --v2:#f2a33a; --v3:#d93a2f; --v4:#8a1c1c;
  --font-display:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  --font-body:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171e; --surface:#1c222b; --ink:#e7eaef; --muted:#9aa4b3; --line:#323a47;
    --accent:#86b8ea; --accent-ink:#0d1620; --ok:#63c28b; --warn-bg:#3a3217;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171e; --surface:#1c222b; --ink:#e7eaef; --muted:#9aa4b3; --line:#323a47;
  --accent:#86b8ea; --accent-ink:#0d1620; --ok:#63c28b; --warn-bg:#3a3217;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.proto{background:var(--warn-bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);margin-bottom:12px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--surface)}
.pill.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px}
.btn.ghost{background:transparent}
nav.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:12px 16px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--v3);color:#fff;font-size:13px;text-align:center;margin-left:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
@media (max-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{position:relative;min-height:104px;border:1px dashed var(--line);border-radius:10px;padding:8px;text-align:left;background:transparent;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.slot .nr{font-family:var(--font-display);font-weight:800;font-size:15px}
.slot.full{border:1px solid var(--line);border-left-width:8px;background:var(--surface);color:var(--ink)}
.slot.full.v1{border-left-color:var(--v1)} .slot.full.v2{border-left-color:var(--v2)}
.slot.full.v3{border-left-color:var(--v3)} .slot.full.v4{border-left-color:var(--v4)}
.slot .who{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.slot .meta{font-size:13px;color:var(--muted)}
.vtag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700;width:max-content}
.vtag.v1{background:var(--v1);color:#222}.vtag.v2{background:var(--v2);color:#222}
.vtag.v3{background:var(--v3);color:#fff}.vtag.v4{background:var(--v4);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-family:var(--font-display);font-size:20px;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--font-display);font-size:17px;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
button[disabled]{opacity:.45;pointer-events:none}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle;font-size:15px}
th{background:var(--bg);font-weight:700}
table.ctr th,table.ctr td,th.h1,th.h2,th.h3,th.h4,td.c1,td.c2,td.c3,td.c4{text-align:center}
table.ctr .lnk,td.c1 .lnk,td.c2 .lnk,td.c3 .lnk,td.c4 .lnk{text-align:center}
th.h1{background:var(--v1);color:#222}th.h2{background:var(--v2);color:#222}
th.h3{background:var(--v3);color:#fff}th.h4{background:var(--v4);color:#fff}
td.c1{background:color-mix(in srgb,var(--v1) 45%,var(--surface))}
td.c2{background:color-mix(in srgb,var(--v2) 45%,var(--surface))}
td.c3{background:color-mix(in srgb,var(--v3) 40%,var(--surface))}
td.c4{background:color-mix(in srgb,var(--v4) 45%,var(--surface))}
.hint{font-size:14px;color:var(--muted)}
.lnk{background:none;border:0;padding:6px 0;min-height:36px;color:inherit;font:inherit;text-align:left;text-decoration:none}
.daynav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.daynav input[type=date]{width:auto;min-height:36px;padding:4px 10px}
.letter .lh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.letter .lh img{width:150px;max-width:40%;height:auto}
.letter .cut{border-top:2px dashed #8a93a1;margin:16px 0 8px}
.letter .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#5a6473;margin-top:16px;border-top:1px solid #d8d4cb;padding-top:8px}
.letter .ft img{height:34px;width:auto}
.mailtxt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task input{width:28px;height:28px;flex:none}
.task .t{flex:1}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:10}
.sheet{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:20px;margin:auto}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-height:46px}
canvas.sig{width:100%;height:150px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.consequence{border-left:8px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0}
.consequence.v1{border-color:var(--v1)}.consequence.v2{border-color:var(--v2)}
.consequence.v3{border-color:var(--v3)}.consequence.v4{border-color:var(--v4)}
.err{color:var(--v3);font-weight:700;margin-top:8px}
.photo{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:8px}
.letter{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff;color:#1c2430;font-size:15px}
.letter .ph{background:#ffe9a8;padding:0 4px;border-radius:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media (prefers-reduced-motion: no-preference){.slot,.btn,.chip{transition:background .15s,border-color .15s}}
</style>
</head>

<div class="wrap">
  <div class="proto">Prototyp mit erfundenen Vornamen. Der Umgang mit echten Namen ist noch offen.</div>
  <header class="top">
    <div>
      <h1>Handy-Verwahrung</h1>
      <div class="sub" id="datum"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>

var detailId=null, tab='schrank', klsel='7a', draft=null, ausId=null, ausState=null, sigDrawn=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sy(ts){var d=new Date(ts);return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;}
function dd(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function tt(ts){return new Date(ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
function stu(id){return S.students.filter(function(s){return s.id===id;})[0];}
function inBox(){return S.events.filter(function(e){return !e.aus;});}
function byFach(n){return inBox().filter(function(e){return e.fach===n;})[0];}
function nextFree(){for(var i=1;i<=FAECHER;i++){if(!byFach(i))return i;}return null;}
function nextV(sid){var y=sy(Date.now());return S.events.filter(function(e){return e.sid===sid&&sy(e.ab)===y;}).length+1;}
function vc(v){return 'v'+Math.min(v,4);}
function vlabel(v){return v>=4?(v+'. Verstoß'):(v+'. Verstoß');}
function tasksFor(v){return TASKS[Math.min(v,4)]||[];}
function vForDate(sid,datum){var y=sy(datum+'T12:00:00');return S.events.filter(function(e){return e.sid===sid&&sy(e.ab)===y&&ymd(new Date(e.ab))<=datum;}).length+1;}
function syLabel(datum){var y=sy(datum+'T12:00:00');return y+'/'+String(y+1).slice(2);}
function renumber(sid){
  var g={};
  S.events.filter(function(e){return e.sid===sid;}).forEach(function(e){var y=sy(e.ab);(g[y]=g[y]||[]).push(e);});
  Object.keys(g).forEach(function(y){
    g[y].sort(function(a,b){return new Date(a.ab)-new Date(b.ab)||a.id-b.id;}).forEach(function(e,i){
      var v=i+1, t={};
      e.v=v;
      if(!e.nachtrag){tasksFor(v).forEach(function(x){t[x[0]]=!!(e.tasks&&e.tasks[x[0]]);});}
      e.tasks=t;
    });
  });
}
function openTasks(){
  var out=[];
  S.events.forEach(function(e){
    tasksFor(e.v).forEach(function(t){ if(!(e.tasks&&e.tasks[t[0]])) out.push({e:e,key:t[0],label:t[1]}); });
  });
  return out;
}

function renderHeader(){
  var now=new Date();
  document.getElementById('datum').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Schuljahr '+sy(now)+'/'+(sy(now)+1).toString().slice(2);
  var wd=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  var on=wd>=1&&wd<=5&&mins>=765&&mins<=780;
  var p=document.getElementById('ausgabezeit'); p.className='pill'+(on?' on':''); p.textContent=on?'Ausgabezeit läuft · Raum C 1.6':'Ausgabe 12:45–13:00 Uhr · Raum C 1.6';
  var n=openTasks().length;
  var tabs=[['schrank','Schrank'],['klassen','Klassenlisten'+(n?'<span class="badge" aria-label="'+n+' offene Aufgaben">'+n+'</span>':'')],['protokoll','Tagesliste'],['sicherung','Einstellungen']];
  document.getElementById('tabs').innerHTML=tabs.map(function(t){return '<button role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>';}).join('');
}

function viewSchrank(){
  var full=inBox().length, h='', bd=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup))/864e5):null;
  if(S.events.length&&(bd===null||bd>=7)){h+='<div class="proto"><b>Sicherung fällig.</b> '+(bd===null?'Es gibt noch keine Sicherung.':'Die letzte Sicherung ist '+bd+' Tage alt.')+' <button class="btn small" data-act="tab" data-tab="sicherung">Jetzt sichern</button></div>';}
  h+='<div class="stats"><span class="pill"><b>'+full+'</b> von '+FAECHER+' Fächern belegt</span><span class="pill"><b>'+openTasks().length+'</b> offene Aufgaben</span></div>';
  var cnt1=inBox().filter(function(e){return e.fach<=PROSEITE;}).length, cnt2=inBox().length-cnt1;
  h+='<div class="chips" role="group" aria-label="Seite" style="margin-bottom:12px"><button class="chip" data-act="fpage" data-p="1" aria-pressed="'+(fpage===1)+'">Fach 1–18'+(fpage!==1&&cnt1?'<span class="badge">'+cnt1+'</span>':'')+'</button><button class="chip" data-act="fpage" data-p="2" aria-pressed="'+(fpage===2)+'">Fach 19–36'+(fpage!==2&&cnt2?'<span class="badge">'+cnt2+'</span>':'')+'</button></div>';
  h+='<div class="grid">';
  for(var i=(fpage-1)*PROSEITE+1;i<=fpage*PROSEITE;i++){
    var e=byFach(i);
    if(e){
      var s=stu(e.sid);
      h+='<button class="slot full '+vc(e.v)+'" data-act="open-ausgabe" data-id="'+e.id+'" aria-label="Fach '+i+', '+esc(s.name)+', Klasse '+s.cls+', '+e.v+'. Verstoß. Ausgeben">'+
         '<span class="nr">'+i+'</span><span class="who">'+esc(s.name)+'</span><span class="meta">'+s.cls+' · '+tt(e.ab)+'</span>'+
         '<span class="vtag '+vc(e.v)+'">'+e.v+'. Verstoß</span>'+(e.note||e.photo?'<span class="meta">Schaden vermerkt</span>':'')+'</button>';
    } else {
      h+='<div class="slot" aria-label="Fach '+i+' frei"><span class="nr">'+i+'</span><span class="meta">frei</span></div>';
    }
  }
  h+='</div><p class="hint">Fach antippen, um das Gerät auszugeben.</p>';
  return h;
}

function viewKlassen(){
  var cl=klassen(); if(cl.indexOf(klsel)<0)klsel=cl[0]||'';
  var y=sy(Date.now()), h='<div class="chips" role="group" aria-label="Klasse">';
  klassen().forEach(function(c){h+='<button class="chip" data-act="klasse" data-c="'+c+'" aria-pressed="'+(klsel===c)+'">'+c+'</button>';});
  h+='</div>';
  h+='<div class="card" style="margin-top:16px"><h2>Klasse '+klsel+' · Schuljahr '+y+'/'+(y+1).toString().slice(2)+'</h2><div class="hint" style="margin-bottom:8px">Klassenleitung: '+(klAdressen(klsel).join(', ')||'noch nicht eingetragen (siehe Einstellungen)')+'</div><div class="tablewrap"><table><thead><tr><th>Vorname</th>'+
     [1,2,3,4].map(function(n){return '<th class="h'+n+'">'+n+'. Verstoß</th>';}).join('')+'</tr></thead><tbody>';
  S.students.filter(function(s){return s.cls===klsel;}).forEach(function(s){
    var ev=S.events.filter(function(e){return e.sid===s.id&&sy(e.ab)===y;}).sort(function(a,b){return new Date(a.ab)-new Date(b.ab);});
    h+='<tr><td><b>'+esc(s.name)+'</b></td>';
    for(var i=0;i<4;i++){ h+= ev[i] ? '<td class="c'+(i+1)+'"><button class="lnk" data-act="detail" data-id="'+ev[i].id+'">'+dd(ev[i].ab)+(ev[i].aus?'':' · im Schrank')+(ev[i].nachtrag?'<span style="display:block;font-size:12px">nachgetragen</span>':ev[i].ohne?'<span style="display:block;font-size:12px">ohne Verwahrung</span>':'')+'</button></td>' : '<td></td>'; }
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  var ot=openTasks().filter(function(o){return stu(o.e.sid).cls===klsel;});
  h+='<div class="card"><h2>Offene Aufgaben für '+klsel+'</h2>';
  if(!ot.length){h+='<div class="hint">Alles erledigt.</div>';}
  ot.forEach(function(o){
    var s=stu(o.e.sid), id='t'+o.e.id+o.key;
    h+='<div class="task"><input type="checkbox" id="'+id+'" data-act="task" data-id="'+o.e.id+'" data-key="'+o.key+'" aria-label="Als erledigt markieren: '+esc(s.name)+', '+esc(o.label)+'"><div class="t"><b>'+esc(s.name)+'</b> · '+o.e.v+'. Verstoß am '+dd(o.e.ab)+'<br><span class="hint">'+esc(o.label)+'</span></div>'+

  });
  h+='</div>';
  return h;
}

function initSig(){
  var c=document.getElementById('sig'); if(!c)return;
  var dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  var x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.5; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111';
  var down=false;
  function pt(ev){var b=c.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top];}
  c.addEventListener('pointerdown',function(ev){down=true;c.setPointerCapture(ev.pointerId);var p=pt(ev);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();sigDrawn=true;});
  c.addEventListener('pointermove',function(ev){if(!down)return;var p=pt(ev);x.lineTo(p[0],p[1]);x.stroke();});
  function up(){down=false;}
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
}

function tw(s,size){
  var w=0,i,c,b;
  for(i=0;i<s.length;i++){
    c=s.charCodeAt(i);
    if(c>=32&&c<=126){w+=HW[c-32];}
    else{b=s.charAt(i).normalize('NFD').charCodeAt(0);w+=(b>=32&&b<=126)?HW[b-32]:556;}
  }
  return w*size/1000;
}
function jpgDims(j){
  var i=2,m;
  while(i<j.length){

    m=j.charCodeAt(i+1);
    if(m>=192&&m<=195){return {h:(j.charCodeAt(i+5)<<8)|j.charCodeAt(i+6),w:(j.charCodeAt(i+7)<<8)|j.charCodeAt(i+8)};}
    i+=2+((j.charCodeAt(i+2)<<8)|j.charCodeAt(i+3));

}

function saveBlob(fname,blob,msgId,onOk){
  function msg(t){var m=document.getElementById(msgId);if(m)m.textContent=t;}
  function plain(){
    var u=URL.createObjectURL(blob),a=document.createElement('a');

    claude.use('downloads').then(function(dl){

    }).catch(function(err){if(err&&err.code==='declined')return;msg('Speichern hat nicht geklappt: '+((err&&err.message)||'unbekannter Fehler'));});

/*IMP-START*/
var PART=/^(von|van|vom|der|den|de|del|ter|zu|zur|el|al)$/i;
function splitCsvLine(line,d){
  var out=[],cur='',q=false,i,c;
  for(i=0;i<line.length;i++){
    c=line.charAt(i);
    if(q){if(c==='"'){if(line.charAt(i+1)==='"'){cur+='"';i++;}else{q=false;}}else{cur+=c;}}
    else if(c==='"'){q=true;}
    else if(c===d){out.push(cur);cur='';}
    else{cur+=c;}
  }
  out.push(cur);
  return out.map(function(x){return x.trim();});
}
function parseKlassenCsv(text){
  text=text.replace(/^﻿/,'');
  var lines=text.split(/\r\n|\n|\r/).filter(function(l){return l.trim()!=='';});
  if(!lines.length)return {err:'Die Datei ist leer.'};
  var wrapped=lines.length>0&&lines.every(function(l){var t=l.trim();return t.length>1&&t.charAt(0)==='"'&&t.charAt(t.length-1)==='"';})&&lines[0].indexOf('""')>-1;
  if(wrapped){lines=lines.map(function(l){return l.trim().slice(1,-1).replace(/""/g,'"');});}
  var h=lines[0], d=';', best=-1;
  [';',',','\t'].forEach(function(x){var n=h.split(x).length;if(n>best){best=n;d=x;}});
  var head=splitCsvLine(h,d).map(function(x){return x.toUpperCase().replace(/[^A-ZÄÖÜ]/g,'');});
  function idx(names){var i;for(i=0;i<head.length;i++){if(names.indexOf(head[i])>-1)return i;}return -1;}
  var ic=idx(['KLASSE','KLASSENNAME','KL']), inn=idx(['FAMILIENNAME','NACHNAME','NAME']), iv=idx(['RUFNAME','VORNAME']);
  if(ic<0||inn<0||iv<0){return {err:'Die Spalten Klasse, Nachname und Rufname oder Vorname wurden nicht gefunden. Gefunden: '+head.join(', ')};}
  var rows=[];
  lines.slice(1).forEach(function(l){
    var f=splitCsvLine(l,d), c=(f[ic]||'').replace(/\s+/g,''), n=(f[inn]||''), v=(f[iv]||'').replace(/\s+/g,' ');
    if(c&&n&&v)rows.push({cls:c,nach:n,vor:v});
  });
  if(!rows.length)return {err:'Es wurden keine Schülerzeilen gefunden.'};
  return {rows:rows};
}
function nachKey(nach){
  var w=nach.trim().split(/\s+/);
  while(w.length>1&&PART.test(w[0])){w.shift();}
  return w.join('').replace(/-/g,'');
}
/* Rufname; nur bei Doppelungen in der Klasse zusätzlich Anfangsbuchstabe(n) des Nachnamens */
function displayNames(rows){
  var groups={};
  rows.forEach(function(r){r.key=nachKey(r.nach);var g=r.cls+'|'+r.vor.toLowerCase();(groups[g]=groups[g]||[]).push(r);});
  Object.keys(groups).forEach(function(g){
    var list=groups[g], n, maxLen=0, cnt={};
    if(list.length===1){list[0].disp=list[0].vor;return;}
    list.forEach(function(r){maxLen=Math.max(maxLen,r.key.length);});
    var found=false;
    for(n=1;n<=maxLen;n++){
      var seen={},uniq=true;
      list.forEach(function(r){var k=r.key.slice(0,n).toLowerCase();if(seen[k])uniq=false;seen[k]=1;});
      if(uniq){found=true;break;}
    }
    if(!found){n=1;}
    list.forEach(function(r){
      var k=r.key.slice(0,n); k=k.charAt(0).toUpperCase()+k.slice(1);
      r.disp=r.vor+' '+k+'.';
      cnt[r.disp]=(cnt[r.disp]||0)+1;
      if(cnt[r.disp]>1){r.disp+=' ('+cnt[r.disp]+')';}
    });
  });
  return rows;
}
/*IMP-END*/
var pendingImport=null;
function klassen(){
  var set={};
  S.students.forEach(function(s){set[s.cls]=1;});
  return Object.keys(set).sort(function(a,b){var na=parseInt(a,10)||0,nb=parseInt(b,10)||0;return na!==nb?na-nb:(a<b?-1:a>b?1:0);});
}
function readKlassen(file){
  var r=new FileReader();
  r.onload=function(){
    var m=document.getElementById('imp-msg'), txt, res;
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(r.result);}catch(e){txt=new TextDecoder('windows-1252').decode(r.result);}
    res=parseKlassenCsv(txt);
    if(res.err){if(m)m.textContent=res.err;return;}
    displayNames(res.rows);
    pendingImport=res.rows;
    showImport();
  };
  r.readAsArrayBuffer(file);
}
function showImport(){
  var by={}, h;
  pendingImport.forEach(function(r){(by[r.cls]=by[r.cls]||[]).push(r.disp);});
  h='<div class="overlay" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Klassenliste importieren"><h2>Klassenliste importieren</h2><p>Gefunden: <b>'+pendingImport.length+' Schüler:innen</b> in '+Object.keys(by).length+' Klasse(n). Übernommen werden nur der Rufname und, falls in der Klasse nötig, der Anfangsbuchstabe des Nachnamens. Nachname und Geburtsdatum werden verworfen.</p>';
  Object.keys(by).sort().forEach(function(c){
    h+='<h3>Klasse '+esc(c)+'</h3><div class="chips">'+by[c].slice().sort().map(function(n){return '<span class="pill">'+esc(n)+'</span>';}).join('')+'</div>';
  });
  h+='<div class="row"><button class="btn primary" data-act="imp-add">Zu den vorhandenen Klassen hinzufügen</button><button class="btn" data-act="imp-replace">Alles ersetzen</button><button class="btn" data-act="close">Abbrechen</button></div><p class="hint">„Alles ersetzen“ löscht auch die Beispieldaten und alle bisherigen Vorgänge.</p></div></div>';
  document.getElementById('overlay').innerHTML=h;
}
function applyImport(replace){
  var list=pendingImport||[], mk, have={}, k;
  mk=list.map(function(r){return {id:r.cls+'-'+r.disp,name:r.disp,cls:r.cls};});
  mk.sort(function(a,b){return a.name.localeCompare(b.name,'de');});
  if(replace){S.students=mk;S.events=[];S.nextId=1;}
  else{S.students.forEach(function(s){have[s.id]=1;});mk.forEach(function(s){if(!have[s.id])S.students.push(s);});}
  pendingImport=null; save(); closeOv();
  k=klassen(); if(k.indexOf(klsel)<0)klsel=k[0]||'';
  render();
}

      h+='<div style="margin-top:6px"><b>Abgeholt von:</b> '+(e.von?esc(e.von)+' (erziehungsberechtigte Person)':'Schülerin oder Schüler')+'</div>';
      if(e.bereinigt){
        h+='<div class="hint" style="margin-top:6px">Foto und Unterschrift wurden am '+dfull(e.bereinigt)+' aus der App entfernt. Sie sind nur noch in Sicherungsdateien vorhanden.</div>';
        h+='<div class="row"><label class="btn small" for="f-reload" style="display:inline-flex;align-items:center">Aus Sicherung nachladen</label><input type="file" id="f-reload" accept=".json,application/json" style="position:absolute;left:-9999px"></div><div id="rl-msg" class="err" role="alert"></div>';
      } else {
        h+='<div style="margin-top:6px"><b>Unterschrift:</b></div>';
        h+= (e.sig&&e.sig.indexOf('data:')===0) ? '<img class="photo" style="background:#fff" alt="Unterschrift" src="'+e.sig+'">' : '<div class="hint">liegt vor (Beispieldaten)</div>';
      }
    } else {
      h+='<div class="hint">Noch im Schrank.</div>';
    }
  }
  var ts=tasksFor(e.v);
  if(ts.length){
    h+='<h3>Aufgaben</h3>';
    ts.forEach(function(t){var ok=e.tasks&&e.tasks[t[0]];h+='<div class="task"><span aria-hidden="true">'+(ok?'✓':'○')+'</span><span class="t">'+esc(t[1])+' <span class="hint">('+(ok?'erledigt':'offen')+')</span></span>'+(t[0]==='kl'&&!ok?'<button class="btn small" data-act="mail" data-id="'+e.id+'">Mail vorbereiten</button>':'')+'</div>';});
  }
  h+='<div class="row">';
  if(!e.aus){h+='<button class="btn primary" data-act="open-ausgabe" data-id="'+e.id+'">Gerät ausgeben</button>';}
  if(e.v===2){h+='<button class="btn" data-act="elterninfo" data-id="'+e.id+'">Elterninfo ansehen</button>';}
  h+='</div></div></div>';
  document.getElementById('overlay').innerHTML=h;
}
function closeOv(){document.getElementById('overlay').innerHTML='';draft=null;ausId=null;}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='bg'){ if(ev.target===t) closeOv(); return; }
  if(a==='tab'){tab=t.getAttribute('data-tab');render();}
  else if(a==='day'){var dv=parseInt(t.getAttribute('data-d'),10);if(dv===0){tagDate=ymd(new Date());}else{var nd=new Date(tagDate+'T12:00:00');nd.setDate(nd.getDate()+dv);tagDate=ymd(nd);}render();}
  else if(a==='mail'){openMail(parseInt(t.getAttribute('data-id'),10));}
  else if(a==='mail-copy'){copyMail();}
  else if(a==='imp-add'){applyImport(false);}
  else if(a==='imp-replace'){applyImport(true);}
  else if(a==='mail-settings'){closeOv();tab='sicherung';render();}
  else if(a==='pdf'){savePdf(parseInt(t.getAttribute('data-id'),10));}
  else if(a==='fpage'){fpage=parseInt(t.getAttribute('data-p'),10);render();}
  else if(a==='detail'){openDetail(parseInt(t.getAttribute('data-id'),10));}
  else if(a==='klasse'){klsel=t.getAttribute('data-c');render();}
  else if(a==='open-abgabe'){openAbgabe();}
  else if(a==='close'){closeOv();}
  else if(a==='a-cls'){draft.cls=t.getAttribute('data-c');draft.sid=null;draft.err='';renderAbgabe();}
  else if(a==='a-stu'){draft.sid=t.getAttribute('data-id');draft.err='';renderAbgabe();}
  else if(a==='a-save'){saveAbgabe();}
  else if(a==='open-ausgabe'){openAusgabe(parseInt(t.getAttribute('data-id'),10));}
  else if(a==='sig-clear'){var c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);sigDrawn=false;}
  else if(a==='aus-save'){saveAusgabe();}
  else if(a==='elterninfo'){openElterninfo(parseInt(t.getAttribute('data-id'),10));}
  else if(a==='task-done'){setTask(parseInt(t.getAttribute('data-id'),10),t.getAttribute('data-key'),true);closeOv();render();}
  else if(a==='reset-ask'){confirmBox('Alles zurücksetzen?','Alle Vorgänge auf diesem Gerät werden gelöscht und durch Beispieldaten ersetzt. Das lässt sich nur mit einer Sicherung rückgängig machen.','Zurücksetzen','reset');}
  else if(a==='reset'){S=seed();save();closeOv();render();}
  else if(a==='bk-save'){saveBackup();}
  else if(a==='a-mode'){draft.mode=t.getAttribute('data-m');draft.err='';draft.ok='';renderAbgabe();}
  else if(a==='a-grund'){draft.grund=GRUENDE[parseInt(t.getAttribute('data-g'),10)];draft.err='';renderAbgabe();}
  else if(a==='cd'){S.cleanDays=parseInt(t.getAttribute('data-n'),10);save();render();}
  else if(a==='clean-ask'){
    var cn=cleanable().length;
    if(!backupFresh()){msgIn('cl-msg','Bitte zuerst oben eine Sicherung speichern. Danach geht es hier weiter.');}
    else if(cn){confirmBox('Fotos und Unterschriften entfernen?','Bei '+cn+' '+(cn===1?'Vorgang':'Vorgängen')+' werden Foto und Unterschrift aus der App entfernt. Die Sicherung wurde gerade gespeichert. Prüfe bitte, dass die Datei an ihrem Ablageort liegt.','Entfernen','clean-ok');}
  }
  else if(a==='clean-ok'){
    var now=new Date().toISOString(), k=0;
    cleanable().forEach(function(e){e.photo=null;e.sig='entfernt';e.bereinigt=now;k++;});
    save(); closeOv(); render(); msgIn('cl-msg',k+' '+(k===1?'Vorgang':'Vorgänge')+' bereinigt.');
  }
  else if(a==='year-ask'){
    var yy=parseInt(t.getAttribute('data-y'),10), yn=S.events.filter(function(e){return sy(e.ab)===yy;}).length;
    if(!backupFresh()){msgIn('yd-msg','Bitte zuerst oben eine Sicherung speichern. Danach geht es hier weiter.');}
    else{pendingYear=yy;confirmBox('Schuljahr '+yy+'/'+String(yy+1).slice(2)+' löschen?',yn+' Einträge dieses Schuljahres werden endgültig aus der App gelöscht. Das lässt sich nur mit der gerade gespeicherten Sicherung rückgängig machen.','Endgültig löschen','year-ok');}
  }
  else if(a==='year-ok'){
    if(pendingYear!==null){var py=pendingYear;S.events=S.events.filter(function(e){return sy(e.ab)!==py;});pendingYear=null;save();}
    closeOv(); render();
  }
  else if(a==='restore-ok'){if(pendingRestore){S=pendingRestore;if(!S.nextId)S.nextId=1000;pendingRestore=null;save();}closeOv();render();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.getAttribute&&t.getAttribute('data-act')==='task'){setTask(parseInt(t.getAttribute('data-id'),10),t.getAttribute('data-key'),t.checked);render();}
  if(t.id==='f-klassen'&&t.files&&t.files[0]){readKlassen(t.files[0]);t.value='';}
  if(t.id==='f-restore'&&t.files&&t.files[0]){readRestore(t.files[0]);t.value='';}
  if(t.id==='f-reload'&&t.files&&t.files[0]){readReload(t.files[0]);t.value='';}
  if(t.id==='f-datum'&&t.value){draft.datum=t.value;draft.ok='';renderAbgabe();}
  if(t.id==='f-tag'&&t.value){tagDate=t.value;render();}
  if(t.id==='f-photo'&&t.files&&t.files[0]){shrink(t.files[0],function(u){draft.photo=u;renderAbgabe();});}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='f-fach')draft.fach=t.value; if(t.id==='f-lehrer')draft.lehrer=t.value; if(t.id==='f-note')draft.note=t.value;
  if(t.id&&t.id.indexOf('f-kl-')===0){if(!S.kl)S.kl={};S.kl[t.id.slice(5)]=t.value;save();}
  if(t.id==='f-von')ausState.von=t.value; if(t.id==='f-aL')ausState.lehrer=t.value;
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeOv();});
function setTask(id,key,val){var e=S.events.filter(function(x){return x.id===id;})[0];e.tasks=e.tasks||{};e.tasks[key]=val;save();}

try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();}}catch(e){}
render();
setInterval(renderHeader,30000);
})();
</script>
</body>
</html>
